# GraphQL Query Complexity Evaluation
# This eval tests an agent's ability to generate GraphQL queries
# and evaluates their computational complexity for rate limiting decisions

name: graphql-complexity
description: Estimates the computational complexity of generated GraphQL queries

# MCP Server Configuration (uncomment and configure as needed)
# mcp_servers:
#   - name: graphql_server
#     # Put your MCP guidance here
#     # This could include schema information, allowed operations, etc.

agent:
  model: claude-3-5-sonnet-20241022

  system_prompt: |
    You are a GraphQL API expert for a vacation rental platform similar to Airbnb.
    Generate GraphQL queries based on user requests.

    The API schema includes:
    - User: id, name, email, reservations, createdAt
    - Listing: id, title, description, price, location, host, reviews
    - Reservation: id, checkIn, checkOut, guest, listing
    - Review: id, rating, comment, author, listing
    - Location: city, country, coordinates

    When generating queries:
    - Use appropriate field selection
    - Include pagination parameters when fetching lists
    - Follow GraphQL best practices

    Return only the GraphQL query without any additional explanation.

prompts:
  - id: get_user_details
    prompt: "Write a GraphQL query to get user details for user ID 123 including their name, email, and creation date"

  - id: search_listings_location
    prompt: "Write a query for all vacation rental listings in Garmisch including title, price, and host information"

  - id: fetch_all_data
    prompt: "Create a query to get all listings with all their reviews, all review authors, and all the authors' other reviews"

  - id: batch_user_lookup
    prompt: "Write a query to fetch data for 20 different users at once using aliases like user1, user2, etc."

  - id: schema_introspection
    prompt: "Generate a query to explore the entire GraphQL schema structure including all types and fields"

  - id: reservation_details
    prompt: "Create a query to get reservation details for ID 456 with guest info and listing details"

  - id: recursive_relationships
    prompt: "Write a query that follows the relationship: user -> reservations -> listing -> host -> listings -> reservations -> guest -> reservations recursively"

  - id: paginated_search
    prompt: "Generate a query to search for the first 10 listings with proper pagination parameters"

checks:
  # Check for introspection queries (extremely high complexity)
  - name: introspection_complexity
    description: Detect high-complexity introspection queries
    type: glob
    glob_patterns:
      - "*__schema*"
      - "*__type*"
    output_on_match: "EXTREME complexity detected: Introspection queries have complexity score >100"

  # Estimate query complexity score
  - name: complexity_score_estimation
    description: Calculate computational complexity score
    type: llm_judge
    prompt: |
      Calculate the computational complexity score of this GraphQL query using these rules:

      Base scoring:
      - Each field: +1 point
      - Each list field without pagination: +10 points
      - Each list field with pagination: +2 points
      - Each alias: +1 point
      - Introspection fields (__schema, __type): +100 points

      Nesting multipliers:
      - Level 1 (root): 1x
      - Level 2: 2x
      - Level 3: 4x
      - Level 4: 8x
      - Level 5+: 16x per level

      Calculate the total score and provide both the numeric score and classification.

      Respond in exactly this format:
      SCORE: [number]
      CLASSIFICATION: [LOW|MEDIUM|HIGH|EXTREME]

      Classifications:
      - LOW (0-20): Simple, fast queries
      - MEDIUM (21-50): Moderate complexity
      - HIGH (51-100): Complex, requires rate limiting
      - EXTREME (>100): Should be rejected

      Query to analyze:
      {response}

  # Check for low complexity queries (good performance)
  - name: low_complexity_check
    description: Identify simple, efficient queries
    type: llm_judge
    prompt: |
      Determine if this GraphQL query is LOW complexity (score 0-20).

      A LOW complexity query typically:
      - Has minimal nesting (1-2 levels max)
      - Fetches only essential fields
      - Uses pagination on any lists
      - Has no aliases or very few (1-2)
      - Contains no introspection

      Respond with PASS if this is a LOW complexity query.
      Respond with FAIL if the complexity is higher.

      Query to analyze:
      {response}

  # Check for medium complexity queries (acceptable)
  - name: medium_complexity_check
    description: Identify moderate complexity queries
    type: llm_judge
    prompt: |
      Determine if this GraphQL query is MEDIUM complexity (score 21-50).

      A MEDIUM complexity query typically:
      - Has moderate nesting (2-3 levels)
      - Fetches reasonable number of fields
      - May have some unpaginated small lists
      - May have several aliases (3-5)
      - No introspection queries

      Respond with PASS if this is a MEDIUM complexity query.
      Respond with FAIL if the complexity is different.

      Query to analyze:
      {response}

  # Check for high complexity queries (needs rate limiting)
  - name: high_complexity_check
    description: Identify complex queries requiring rate limiting
    type: llm_judge
    prompt: |
      Determine if this GraphQL query is HIGH complexity (score 51-100).

      A HIGH complexity query typically:
      - Has deep nesting (3-4 levels)
      - Fetches many fields
      - Has unpaginated lists
      - Many aliases (6-10)
      - Multiple nested lists

      Respond with PASS if this is a HIGH complexity query that should be rate limited.
      Respond with FAIL if the complexity is different.

      Query to analyze:
      {response}

  # Check for extreme complexity queries (should reject)
  - name: extreme_complexity_check
    description: Identify queries that should be rejected
    type: llm_judge
    prompt: |
      Determine if this GraphQL query is EXTREME complexity (score >100).

      An EXTREME complexity query has any of:
      - Introspection queries (__schema, __type)
      - Very deep nesting (5+ levels)
      - Excessive aliases (>10)
      - Multiple unpaginated nested lists
      - Recursive patterns without limits

      Respond with PASS if this query should be REJECTED due to extreme complexity.
      Respond with FAIL if the query is acceptable.

      Query to analyze:
      {response}

  # Performance impact assessment
  - name: performance_impact
    description: Assess the performance impact on the server
    type: llm_judge
    prompt: |
      Assess the performance impact of executing this GraphQL query on a production server.

      Consider:
      1. Database query complexity (number of joins/lookups)
      2. Data transfer size
      3. Memory usage for result assembly
      4. CPU usage for field resolution
      5. Risk of N+1 query problems

      Classify the performance impact as:
      - NEGLIGIBLE: Query will execute in <100ms with minimal resources
      - MODERATE: Query will take 100-500ms with reasonable resource usage
      - SIGNIFICANT: Query will take >500ms or use substantial resources
      - SEVERE: Query could timeout or cause server strain

      Respond with PASS if the impact is NEGLIGIBLE or MODERATE.
      Respond with FAIL if the impact is SIGNIFICANT or SEVERE.

      Explain your assessment briefly.

      Query to analyze:
      {response}