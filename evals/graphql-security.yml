# GraphQL Security Evaluation
# This eval detects dangerous GraphQL query patterns that could lead to:
# - Denial of Service (DoS) attacks
# - Information disclosure
# - Excessive resource consumption
# - Schema introspection abuse

name: graphql-security-check
description: Evaluates GraphQL queries for security vulnerabilities and dangerous patterns

model: claude-3-5-sonnet-20241022

system_prompt: |
  You are a GraphQL security expert. Your job is to analyze GraphQL queries for security vulnerabilities.

  You should flag queries that exhibit ANY of these dangerous patterns:

  1. DEPTH ATTACKS: Deeply nested queries (>5 levels) that can cause exponential resource consumption
  2. INTROSPECTION ABUSE: Schema introspection queries in production (__schema, __type)
  3. BATCH ATTACKS: Excessive aliasing or query batching (>10 aliases)
  4. RECURSIVE QUERIES: Circular relationship queries without depth limits
  5. EXPENSIVE FIELDS: Queries requesting computationally expensive fields without pagination
  6. MISSING PAGINATION: Large list queries without first/limit parameters

  For each query, respond with:
  - SAFE: If the query has no security concerns
  - DANGEROUS: If the query exhibits any of the patterns above

  Then explain which pattern(s) were detected and why it's problematic.

test_cases:
  # Safe queries
  - input: |
      query GetUser {
        user(id: "123") {
          name
          email
          createdAt
        }
      }
    expected_output: SAFE

  - input: |
      query ListListings {
        listings(first: 20, offset: 0) {
          id
          title
          price
          location {
            city
            country
          }
        }
      }
    expected_output: SAFE

  - input: |
      query GetReservation {
        reservation(id: "456") {
          checkIn
          checkOut
          guest {
            name
            email
          }
          listing {
            title
            host {
              name
            }
          }
        }
      }
    expected_output: SAFE

  # Dangerous queries
  - input: |
      query DangerousIntrospection {
        __schema {
          types {
            name
            fields {
              name
              type {
                name
                kind
              }
            }
          }
        }
      }
    expected_output: DANGEROUS

  - input: |
      query DeepNesting {
        user(id: "1") {
          reservations {
            listing {
              host {
                listings {
                  reservations {
                    guest {
                      reservations {
                        listing {
                          reviews {
                            author {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    expected_output: DANGEROUS

  - input: |
      query BatchAttack {
        user1: user(id: "1") { name }
        user2: user(id: "2") { name }
        user3: user(id: "3") { name }
        user4: user(id: "4") { name }
        user5: user(id: "5") { name }
        user6: user(id: "6") { name }
        user7: user(id: "7") { name }
        user8: user(id: "8") { name }
        user9: user(id: "9") { name }
        user10: user(id: "10") { name }
        user11: user(id: "11") { name }
        user12: user(id: "12") { name }
        user13: user(id: "13") { name }
        user14: user(id: "14") { name }
        user15: user(id: "15") { name }
      }
    expected_output: DANGEROUS

  - input: |
      query NoPagination {
        allListings {
          id
          title
          description
          reviews {
            comment
            rating
            author {
              name
              reviews {
                comment
              }
            }
          }
        }
      }
    expected_output: DANGEROUS

grader:
  type: llm_rubric
  rubric: |
    The model should correctly identify whether the query is SAFE or DANGEROUS.

    A response is correct if:
    1. It contains the correct classification (SAFE or DANGEROUS)
    2. For DANGEROUS queries, it identifies at least one valid security concern

    Grade as:
    - PASS: If the classification is correct
    - FAIL: If the classification is incorrect
